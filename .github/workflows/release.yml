# Release pipeline for rmux.
#
# - Pushing a tag like v0.1.0 builds all 5 targets, packages them, and
#   publishes a GitHub Release with the archives and SHA256SUMS.
# - Running the workflow by hand (workflow_dispatch) only builds and packages.
#   It never publishes a release.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only one run per ref at a time. Never cancel a run that is already
# publishing, so a half-finished release is not left behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default. Only the release job can write to the repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not keep the token in .git/config for later steps.
          persist-credentials: false

      # On a tag push, the tag must match the version in Cargo.toml.
      - name: Check tag matches Cargo.toml version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME}"
          # Read the version = "..." line that sits under [package] (awk: same on macOS, Linux and Windows).
          cargo_version=$(awk -F'"' '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          if [ "$tag" != "v${cargo_version}" ]; then
            echo "::error::Tag '${tag}' does not match Cargo.toml version '${cargo_version}'. Expected tag v${cargo_version}." >&2
            exit 1
          fi
          echo "Tag ${tag} matches Cargo.toml version ${cargo_version}."

      # Tag builds use the tag name. Other builds use dev-<short sha>.
      - name: Compute archive name
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "ARCHIVE=rmux-${version}-${{ matrix.target }}" >> "$GITHUB_ENV"

      # Use rustup directly, with no third-party Rust action.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package and checksum
        run: |
          # Stage the binary, README and (if present) LICENSE in one folder.
          bin="rmux"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            bin="rmux.exe"
          fi
          mkdir -p "$ARCHIVE" dist
          cp "target/${{ matrix.target }}/release/${bin}" "$ARCHIVE/"
          cp README.md "$ARCHIVE/"
          if [ -f LICENSE ]; then
            cp LICENSE "$ARCHIVE/"
          fi

          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -tzip "dist/$ARCHIVE.zip" "$ARCHIVE" > /dev/null
          else
            tar -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          fi

          # Run in dist/ so the .sha256 file lists only the file name.
          cd dist
          if command -v shasum > /dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE.${{ matrix.ext }}" > "$ARCHIVE.${{ matrix.ext }}.sha256"
          else
            sha256sum "$ARCHIVE.${{ matrix.ext }}" > "$ARCHIVE.${{ matrix.ext }}.sha256"
          fi
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rmux-${{ matrix.target }}
          path: |
            dist/${{ env.ARCHIVE }}.${{ matrix.ext }}
            dist/${{ env.ARCHIVE }}.${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    # Only a real tag push publishes. Manual runs stop after build.
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job does not check out the repo. It only needs the artifacts.
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rmux-*
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS and verify
        shell: bash
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          if command -v shasum > /dev/null 2>&1; then
            shasum -a 256 -c SHA256SUMS
          else
            sha256sum -c SHA256SUMS
          fi
          # Exactly 5 archives: one per target.
          count=$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "::error::Expected 5 archives, found ${count}." >&2
            exit 1
          fi
          find . -maxdepth 1 -type f -print

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tags with a '-' (for example v1.0.0-rc1) are marked as pre-releases.
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # No --clobber: if the release already exists, this step fails.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            $prerelease_flag \
            dist/*
